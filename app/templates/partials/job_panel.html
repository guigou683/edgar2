<div class="job-panel" data-job-panel hidden>
  <div class="job-head">
    <span class="job-title">Import en cours…</span>
    <span class="job-eta" data-job-eta></span>
  </div>
  <div class="job-bar"><div class="job-bar-fill" data-job-fill></div></div>
  <div class="job-counts">
    <span data-job-progress>0 / 0</span> ·
    <span class="ok">✔ <b data-job-ok>0</b> réussis</span> ·
    <span class="muted">↷ <b data-job-skip>0</b> ignorés</span> ·
    <span class="ko">✕ <b data-job-fail>0</b> échecs</span>
  </div>
  <div class="job-current" data-job-current></div>
  <div class="job-stats" data-job-stats hidden></div>
  <details class="job-failures" data-job-failures hidden>
    <summary>Échecs (raisons)</summary>
    <ul data-job-failure-list></ul>
  </details>
</div>
