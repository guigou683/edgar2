{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <form class="auth-card" method="post" action="/register" autocomplete="off" data-validate-form>
    <h1 class="auth-title">Demander un accès</h1>

    {% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}
    {% if confirm %}<p class="alert alert-ok">{{ confirm }}</p>{% endif %}

    {% if not confirm %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Nom d'utilisateur
      <input type="text" name="username" required autofocus placeholder="prenom.nom"
             data-rule="username">
    </label>
    <label>Courriel
      <input type="email" name="email" required placeholder="prenom.nom@example.fr"
             data-rule="email">
    </label>
    <label>Mot de passe
      <input type="password" name="password" required data-rule="password" data-pw-input>
    </label>
    {% include "partials/password_rules.html" %}
    <label>Confirmer le mot de passe
      <input type="password" name="confirm" required data-rule="confirm">
    </label>
    <button class="btn-primary" type="submit">Envoyer la demande</button>
    {% endif %}

    <p class="auth-foot"><a href="/login">Retour à la connexion</a></p>
  </form>
</div>
{% endblock %}
