# =====================================================================
# EDGAR v2 — orchestration des trois services.
#   ollama  : modèles (embeddings dense + génération), GPU si présent.
#   qdrant  : base vectorielle (vecteurs nommés dense + sparse, RRF natif).
#   app     : application EDGAR (FastAPI), reranking sur CPU.
# Ports décalés (8800/7333/11435) et volumes préfixés "edgar2_" pour
# cohabiter avec la v1 sur le même hôte.
# =====================================================================
name: edgar2

services:
  ollama:
    image: ollama/ollama:0.30.9
    volumes:
      - ./ollama:/root/.ollama                # modèles (bind mount : dossier sur disque, transfert = copie)
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    environment:
      - OLLAMA_NOPRUNE=1                       # ne pas purger les modèles
      - OLLAMA_KEEP_ALIVE=30m                  # garde bge-m3 chaud entre imports (moins de rechargements)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia                   # GPU si pilote + NVIDIA Container Toolkit présents
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - ./qdrant:/qdrant/storage              # base vectorielle (bind mount)
    ports:
      - "${QDRANT_PORT:-7333}:6333"
    ulimits:
      nofile:                                 # Linux natif : évite "Too many open files" (Qdrant ouvre bcp de fichiers)
        soft: 65536
        hard: 65536
    restart: unless-stopped

  app:
    build: ./app
    depends_on:
      - ollama
      - qdrant
    env_file: .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - EDGAR_TLS=1                            # cookies Secure (servi derrière nginx HTTPS)
    volumes:
      - ./data:/app/data                       # SQLite, bases.json, settings.json
      - ./documents:/app/documents             # corpus, un sous-dossier par base
      - ./scripts:/app/scripts:ro              # outils d'exploitation (bootstrap, etc.)
      - ./app/templates:/app/templates:ro      # pages HTML éditables sans rebuild
      - ./app/static:/app/static:ro            # CSS / JS / assets éditables sans rebuild
    # Pas de port publié : l'app n'est joignable que par nginx (réseau interne).
    restart: unless-stopped

  nginx:
    build: ./nginx
    depends_on:
      - app
    ports:
      - "${HTTPS_PORT:-8443}:443"              # HTTPS
      - "${HTTP_PORT:-8800}:80"                # HTTP -> redirection HTTPS
    environment:
      - EDGAR_CERT_CN=${EDGAR_CERT_CN:-localhost}
      - EDGAR_CERT_SAN=${EDGAR_CERT_SAN:-DNS:localhost,IP:127.0.0.1}
    volumes:
      - edgar2_certs:/certs                    # certificat auto-signé (généré au 1er démarrage)
    restart: unless-stopped

volumes:
  edgar2_certs:                               # certificat auto-signé (généré sur place)
