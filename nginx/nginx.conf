# EDGAR v2 — reverse proxy TLS devant l'application.
# HTTPS (443 interne, publié en 8443) + redirection HTTP -> HTTPS.
# Transmet l'IP réelle du client (X-Forwarded-For) et le schéma (X-Forwarded-Proto).

upstream edgar_app {
    server app:8000;
}

# HTTP : redirection vers HTTPS (port externe 8443).
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

# HTTPS : terminaison TLS + proxy vers l'application.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 512m;          # imports de documents volumineux

    location / {
        proxy_pass http://edgar_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Streaming SSE : pas de bufferisation, connexion maintenue.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
